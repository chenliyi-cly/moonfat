name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - run: moon version --all
      # Local moonc 0.10.4 is the source of truth. Current CI moon
      # (0.1.20260920 / moonc 0.10.14) treats derive(Eq, Debug) as
      # implicit_impl_as_method warnings, and versioned 0.1.20260713
      # tarballs return HTTP 403, so fmt --check and --deny-warn are
      # not reliable cross-version gates.
      - run: moon check --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }}
      - name: Run examples
        if: matrix.target == 'wasm-gc'
        run: |
          moon run examples/inspect
          moon run examples/write_payload
          moon run examples/verify_image
