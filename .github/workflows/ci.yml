name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        shell: bash
        run: |
          moon version --all
          actual=$(moonc -v | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p')
          test -n "$actual"
          printf '%s\n' "$actual" | awk -F. '{ if ($1 < 0 || ($1 == 0 && $2 < 10) || ($1 == 0 && $2 == 10 && $3 < 14)) exit 1 }'

      - name: Check source
        run: moon check --target ${{ matrix.target }}

      - name: Build package
        run: moon build --target ${{ matrix.target }} --release

      - name: Run tests
        run: moon test --target ${{ matrix.target }}

      - name: Run examples
        if: matrix.target == 'wasm-gc'
        run: |
          moon run examples/inspect
          moon run examples/write_payload
          moon run examples/verify_image
